services:
  - type: web
    name: market-masters-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    envVars:
      - key: SUPABASE_DB_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: market-masters-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: SEED_DEMO_DATA
        value: "false"

  - type: web
    name: market-masters-frontend
    runtime: static
    rootDir: frontend
    buildCommand: corepack yarn install --frozen-lockfile && corepack yarn build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_BACKEND_URL
        fromService:
          type: web
          name: market-masters-api
          envVarKey: RENDER_EXTERNAL_URL
